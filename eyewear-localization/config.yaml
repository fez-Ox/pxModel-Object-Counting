# Brand vocabulary is configuration, not a prompt to SAM3.
gazetteer:
  - ray-ban
  - oakley
  - gucci
  - prada
  - chanel
  - versace
  - dior
  - armani
  - giorgio armani
  - persol
  - tom ford
  - burberry
  - cartier
  - moncler
  - michael kors
  - dolce & gabbana
  - tiffany & co

cue_reliability:
  C1: 0.95
  C2: 0.30
  C4: 0.35
  L3: 0.70

fusion:
  temperature: 0.6
  unknown_prior: 0.40
  tau: 0.50
  margin: 0.15
  max_per_evidence: null

smoothing:
  lambda: 0.25
  gate_punknown: 0.5

cascade:
  use_vlm_audit: true
  uncertainty_band: [0.45, 0.70]
  c1_threshold: 0.70
  c2_threshold: 0.75
  c4_threshold: 0.85

c1:
  margin: 0.25
  wide_margin: 0.40
  scales: [1.0, 2.0, 4.0]
  use_clahe: true
  dual_polarity: true

ocr:
  scale: 2.0
  fallback_budget: 12

# Batched deployment defaults. Each backend retains sequential fallback for
# unsupported, malformed, or failed batches.
performance:
  c1_batch_size: 4
  sam3_prompt_batch_size: 4
  sam3_compile: false
