# Brand vocabulary is configuration, not a prompt to SAM3.
gazetteer:
  - ray-ban
  - oakley
  - gucci
  - prada
  - chanel
  - versace
  - dior
  - armani
  - giorgio armani
  - persol
  - tom ford
  - burberry
  - cartier
  - moncler
  - michael kors
  - dolce & gabbana
  - tiffany & co

cue_reliability:
  C1: 0.7
  C2: 0.55
  C4: 0.35
  L3: 0.70

fusion:
  temperature: 0.6
  unknown_prior: 0.40
  tau: 0.50
  margin: 0.15
  max_per_evidence: null

smoothing:
  lambda: 0.25
  gate_punknown: 0.5

cascade:
  use_vlm_audit: true
  uncertainty_band: [0.45, 0.70]

# Keep the reference path by default. Increase these only after the parity
# protocol in eyewear_lossless_performance_strategy.md passes on the target GPU.
performance:
  c1_batch_size: 1
  sam3_prompt_batch_size: 1
  sam3_compile: false
