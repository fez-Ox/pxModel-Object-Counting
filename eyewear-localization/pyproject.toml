[project]
name = "eyewear-localization"
version = "0.1.0"
description = "Robust eyewear brand attribution with class-agnostic localization and independent OCR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ocr = [
  "easyocr>=1.7.2",
]
sam3 = [
  "torch>=2.5.0",
  "torchvision>=0.20.0",
  "timm>=1.0.0",
  "einops>=0.7.0",
  "ftfy>=6.1.1",
  "regex>=2023.0.0",
  "typing_extensions>=4.8.0",
  "wrapt>=1.15.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.uv]
package = false
