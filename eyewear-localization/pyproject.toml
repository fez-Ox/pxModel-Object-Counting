[project]
name = "eyewear-localization"
version = "0.1.0"
description = "Robust eyewear brand attribution with class-agnostic localization and independent OCR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ocr = [
  "easyocr>=1.7.2",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.uv]
package = false
