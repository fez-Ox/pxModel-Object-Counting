[project]
name = "sam3-verbose-counting"
version = "0.1.0"
description = "Standalone verbose-prompt SAM3 image counting inference"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5.0",
  "torchvision>=0.20.0",
  "timm>=1.0.0",
  "numpy>=1.26,<2",
  "Pillow>=9.0.0",
  "einops>=0.7.0",
  "ftfy>=6.1.1",
  "regex>=2023.0.0",
  "typing_extensions>=4.8.0",
  "wrapt>=1.15.0",
]

[tool.uv]
package = false
